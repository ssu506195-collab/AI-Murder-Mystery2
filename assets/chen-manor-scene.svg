<g stroke="#253c39" stroke-width="22" fill="none" stroke-linecap="round"><path d="M85 900 Q125 700 65 540 M1450 900 Q1488 690 1450 500"/></g>
<!-- lanterns -->
<g>
 <path d="M270 0V150" stroke="#161b22" stroke-width="8"/><path d="M230 145 Q270 125 310 145 L300 255 Q270 280 240 255Z" fill="url(#lantern)" stroke="#e1bb7c" stroke-width="7"/><path d="M236 170H304M239 230H301" stroke="#f5d69f" stroke-width="5"/><path d="M270 280V330" stroke="#d0a46e" stroke-width="5"/>
 <path d="M1450 0V165" stroke="#171b22" stroke-width="8"/><path d="M1410 160 Q1450 140 1490 160 L1480 270 Q1450 295 1420 270Z" fill="url(#lantern)" stroke="#e1bb7c" stroke-width="7"/><path d="M1416 185H1484M1419 245H1481" stroke="#f5d69f" stroke-width="5"/><path d="M1450 295V345" stroke="#d0a46e" stroke-width="5"/>
</g>
<!-- wet courtyard and mist -->
<path d="M0 600 Q350 535 650 610 T1200 590 T1600 620 V900 H0Z" fill="#1d2b33" opacity=".84"/>
<path d="M780 900 Q760 745 690 620 Q850 680 925 900Z" fill="#958d7c" opacity=".16"/>
<g fill="none" stroke="#e1e7e4" stroke-width="55" opacity=".24" filter="url(#soft)"><path d="M-80 650 Q280 585 520 660 T1000 660 T1700 620"/><path d="M-90 760 Q260 700 550 760 T1150 740 T1700 770"/></g>
<rect width="1600" height="900" fill="url(#mist)"/>
