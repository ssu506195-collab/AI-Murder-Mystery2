<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="民國初年江南陳宅薄霧庭院場景">
<defs>
 <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#263b52"/><stop offset=".52" stop-color="#80909b"/><stop offset="1" stop-color="#2b3945"/></linearGradient>
 <linearGradient id="house" x2="0" y2="1"><stop stop-color="#4c4640"/><stop offset="1" stop-color="#161d25"/></linearGradient>
 <linearGradient id="mist" x2="0" y2="1"><stop stop-color="#dbe1dc" stop-opacity="0"/><stop offset=".48" stop-color="#dce4e0" stop-opacity=".5"/><stop offset="1" stop-color="#dbe1dc" stop-opacity="0"/></linearGradient>
 <linearGradient id="lantern" x2="0" y2="1"><stop stop-color="#eebd70"/><stop offset="1" stop-color="#8f3828"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<circle cx="1220" cy="185" r="95" fill="#e8e2cb" opacity=".45" filter="url(#blur)"/><circle cx="1220" cy="185" r="54" fill="#e5dfcc" opacity=".4"/>
