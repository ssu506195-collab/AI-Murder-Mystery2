 <rect x="455" y="330" width="70" height="140" rx="4"/><rect x="570" y="330" width="70" height="140" rx="4"/>
 <rect x="790" y="340" width="85" height="130"/><rect x="930" y="340" width="85" height="130"/>
 <rect x="1145" y="370" width="70" height="100"/><rect x="1265" y="370" width="70" height="100"/>
</g>
