<g fill="#35434a" stroke="#9e9c8d" stroke-opacity=".35" stroke-width="4"><path d="M80 740H230L255 780H55Z"/><rect x="105" y="650" width="100" height="90"/><path d="M90 650L155 600L220 650Z"/><rect x="130" y="620" width="50" height="30" fill="#c18a54"/></g>
<rect width="1600" height="900" fill="#0e1b2a" opacity=".18"/>
